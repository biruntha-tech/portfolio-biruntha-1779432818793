<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biruntha - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3b82f6; --bg: #f3f4f6; --surface: #ffffff; --text: #1f2937; --text-muted: #6b7280; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(180px, auto); gap: 1.5rem; max-width: 1200px; width: 100%; animation: fadeIn 1s ease-out; }
        .bento-item { background: var(--surface); border-radius: 24px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .bento-item:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        
        .header-item { grid-column: span 3; grid-row: span 2; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .header-item::before { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: var(--primary); opacity: 0.1; border-radius: 50%; filter: blur(50px); }
        h1 { font-size: 4rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.1; letter-spacing: -0.05em; }
        h1 span { color: var(--primary); }
        .bio { font-size: 1.25rem; color: var(--text-muted); max-width: 80%; line-height: 1.6; }
        
        .social-item { grid-column: span 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem; background: var(--primary); color: white; }
        .social-item a { color: white; text-decoration: none; font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; width: 100%; height: 50%; border-radius: 12px; background: rgba(255,255,255,0.2); transition: background 0.3s; }
        .social-item a:hover { background: rgba(255,255,255,0.3); }

        .skills-item { grid-column: span 2; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .section-title::before { content: ''; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; display: inline-block; }
        .skills-container { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .skill-tag { padding: 0.5rem 1rem; background: var(--bg); border-radius: 12px; font-weight: 500; font-size: 0.95rem; color: var(--text); border: 1px solid rgba(0,0,0,0.05); }
        
        .projects-item { grid-column: span 2; grid-row: span 2; }
        .project-list { display: flex; flex-direction: column; gap: 1rem; }
        .project-card { padding: 1.25rem; border-radius: 16px; background: var(--bg); border: 1px solid rgba(0,0,0,0.05); transition: border-color 0.3s; }
        .project-card:hover { border-color: var(--primary); }
        .project-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        .project-card p { color: var(--text-muted); font-size: 0.9rem; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 900px) {
            .bento-grid { grid-template-columns: 1fr; }
            .header-item, .social-item, .skills-item, .projects-item { grid-column: span 1; grid-row: auto; }
            h1 { font-size: 2.5rem; }
            .bio { max-width: 100%; }
            .social-item { flex-direction: row; padding: 1.5rem; }
            .social-item a { height: auto; padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bento-grid">
        <div class="bento-item header-item">
            <h1>Hi, I'm <br><span>Biruntha</span>.</h1>
            <p class="bio">sollikura alavuku ila </p>
        </div>
        
        <div class="bento-item social-item">
            <a href="https://github.com/biruntha-tech" target="_blank">GitHub ↗</a>
            <a href="https://www.linkedin.com/in/biruntha-mageshwaran-226a95306?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank">LinkedIn ↗</a>
        </div>
        
        <div class="bento-item skills-item">
            <h2 class="section-title">My Toolkit</h2>
            <div class="skills-container">
                <span class="skill-tag">neraya Iruku but veliya katrathu illa</span>
            </div>
        </div>
        
        <div class="bento-item projects-item">
            <h2 class="section-title">Featured Work</h2>
            <div class="project-list">
                <div class="project-card"><h3>Many projects</h3><p>An elegant solution built with modern engineering practices.</p></div>
            </div>
        </div>
    </div>
</body>
</html>
